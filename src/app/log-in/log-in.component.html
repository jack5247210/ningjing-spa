<div class="login-container">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-content">
        <h1 class="brand-title">寧境</h1>
        <p class="brand-subtitle">愛與療癒心空間</p>
        <div class="brand-divider"></div>
        <p class="brand-quote">讓個案用最少的資源與時間 獲得最大效果<br>是我內心對妳們的承諾</p>
      </div>
    </div>

    <div class="login-form">
      <h2 class="form-title">歡迎回來</h2>
      <p class="form-subtitle">登入您的會員帳號</p>

      <div class="input-group">
        <label for="email" class="input-label">電子郵件</label>
        <input type="email" id="email" [(ngModel)]="email" placeholder="your@email.com" class="form-input"
          autocomplete="email" />
      </div>

      <div class="input-group">
        <label for="password" class="input-label">密碼</label>
        <input type="password" id="password" [(ngModel)]="password" placeholder="••••••••" class="form-input"
          autocomplete="current-password" />
      </div>

      <button class="btn-primary login-btn" (click)="login()">登入帳號</button>

      <div class="form-actions">
        <button class="text-link" (click)="goToRegister()">還沒有帳號？立即註冊</button>
        <button class="text-link" routerLink="/forgot-password">忘記密碼？</button>
      </div>

      <div class="divider-or"><span>或</span></div>

      <a href="http://localhost:8080/oauth2/authorization/google" class="btn-outline google-btn">
        <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20">
          <path fill="#4285F4"
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
          <path fill="#34A853"
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
          <path fill="#FBBC05"
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
          <path fill="#EA4335"
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
        </svg>
        使用 Google 登入
      </a>

      <p class="login-footer">登入即表示同意我們的隱私政策</p>
    </div>
  </div>
</div>
