<div class="login-container">
  <div class="login-card">
    <div class="login-form">
      <h2 class="form-title">重設密碼</h2>
      <p class="form-subtitle">請輸入您的新密碼</p>

      <div class="input-group">
        <label for="newPassword" class="input-label">新密碼（至少 6 位）</label>
        <input type="password" id="newPassword" [(ngModel)]="newPassword" placeholder="••••••" class="form-input" />
      </div>

      <div class="input-group">
        <label for="confirmPassword" class="input-label">確認新密碼</label>
        <input type="password" id="confirmPassword" [(ngModel)]="confirmPassword" placeholder="••••••" class="form-input" />
      </div>

      <button class="btn-primary login-btn" (click)="submit()" [disabled]="loading">
        {{ loading ? '重設中...' : '確認重設' }}
      </button>

      <div *ngIf="message" class="alert" [class.alert-success]="success" [class.alert-error]="!success">
        {{ message }}
      </div>

      <div class="form-actions" style="justify-content: center;">
        <button class="text-link" routerLink="/login">返回登入</button>
      </div>
    </div>
  </div>
</div>
