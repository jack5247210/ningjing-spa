<div class="store-container container">
  <h2 class="section-title">芳香療程</h2>
  <p class="section-subtitle">沉浸於香氣與撫觸中，喚醒身心自癒力</p>

  <div *ngIf="loading" class="loading-spinner">
    <div class="spinner"></div>
    <p>正在為您準備療程資訊...</p>
  </div>
  <div *ngIf="error" class="error-message">{{ error }}</div>

  <div *ngIf="!loading && !error" class="product-grid">
    <div *ngFor="let product of products" class="card product-card">
      <div class="card-image">
        <img [src]="product.productImg | imageUrl" [alt]="product.title" />
        <span class="tag tag-sage duration-badge">{{ product.duration }} 分鐘</span>
      </div>
      <div class="card-content">
        <h3 class="product-title">{{ product.title }}</h3>
        <p class="product-description">{{ product.introduce }}</p>
        <div class="card-footer">
          <span class="product-price">NT$ {{ product.price }}</span>
          <button class="btn-ghost" [routerLink]="['/product', product.productId]">查看詳情</button>
        </div>
      </div>
    </div>
  </div>
</div>
