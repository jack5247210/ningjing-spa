<div class="oil-detail-container">
  <!-- 加载状态 -->
  <div *ngIf="loading" class="loading-state">
    <div class="spinner"></div>
    <p>載入精油資訊中...</p>
  </div>

  <!-- 商品不存在 -->
  <div *ngIf="!loading && !oil" class="not-found-state">
    <span>😔</span>
    <h3>找不到此精油</h3>
    <a routerLink="/oil-shop">返回商城</a>
  </div>

  <!-- 主要内容 -->
  <div *ngIf="!loading && oil" class="product-main">
    <!-- 左侧图片区 -->
    <div class="product-gallery">
      <div class="main-image">
        <img [src]="oil.oilImg | imageUrl" [alt]="oil.name">
      </div>
      <!-- 未来可扩展缩略图列表 -->
    </div>

    <!-- 右侧信息区 -->
    <div class="product-info">
      <nav class="breadcrumb">
        <a routerLink="/oil-shop">精選精油</a>
        <span class="separator">/</span>
        <span>{{ oil.name }}</span>
      </nav>

      <h1 class="product-title">{{ oil.name }}</h1>
      <p class="product-subtitle">{{ oil.introduce }}</p>

      <div class="price-block">
        <span class="current-price">NT$ {{ oil.price | number }}</span>
        <span class="capacity-badge">{{ oil.capacity }}</span>
      </div>

      <div class="stock-info" [class.low-stock]="oil.stock < 5">
        <span class="stock-icon">📦</span>
        庫存 {{ oil.stock }} 件
        <span *ngIf="oil.stock < 5" class="low-stock-label">（少量現貨）</span>
      </div>

      <!-- 购买区 -->
      <div class="purchase-section">
        <div class="quantity-selector">
          <button (click)="quantity = quantity - 1" [disabled]="quantity <= 1">−</button>
          <input type="number" [(ngModel)]="quantity" min="1" [max]="oil.stock" readonly>
          <button (click)="quantity = quantity + 1" [disabled]="quantity >= oil.stock">+</button>
        </div>

        <button
          class="add-to-cart-btn"
          (click)="addToCart()"
          [disabled]="oil.stock === 0"
        >
          {{ oil.stock > 0 ? '🛒 加入購物車' : '暫時缺貨' }}
        </button>
      </div>

      <!-- 商品描述 -->
      <div class="product-description">
        <h4>產品詳情</h4>
        <p [innerHTML]="oil.description"></p>
      </div>

      <!-- 额外信息 -->
      <div class="extra-info">
        <div class="info-item">
          <span class="info-icon">🌿</span>
          <span>100% 純天然精油</span>
        </div>
        <div class="info-item">
          <span class="info-icon">📦</span>
          <span>滿1000免運費</span>
        </div>
        <div class="info-item">
          <span class="info-icon">🔒</span>
          <span>安全包裝，快速出貨</span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 侧边栏购物车 -->
<app-oil-cart-order *ngIf="isLoggedIn"></app-oil-cart-order>
