@if (!loading && !error && product) {
  <div class="product-detail-page container">
    <div class="back-link">
      <a routerLink="/store" class="btn-ghost">‹ 返回療程列表</a>
    </div>

    <div class="detail-grid card">
      <div class="product-image">
        <img [src]="product.productImg | imageUrl" [alt]="product.title" />
      </div>

      <div class="product-info">
        <div class="info-header">
          <span class="tag tag-sage duration-tag">{{ product.duration }} 分鐘</span>
          <h1 class="main-title">{{ product.title }}</h1>
        </div>

        <div class="description prose" [innerHTML]="product.description"></div>

        <div class="purchase-action">
          <div class="price-box">
            <span class="price-label">療程費用</span>
            <span class="price-amount">NT$ {{ product.price }}</span>
          </div>
          <button class="btn-primary" (click)="goToReservation()">預約此療程</button>
        </div>
      </div>
    </div>
  </div>
} @else if (loading) {
  <div class="loading-spinner">
    <div class="spinner"></div>
    <p>載入詳情中...</p>
  </div>
} @else if (error) {
  <div class="error-message">{{ error }}</div>
}
