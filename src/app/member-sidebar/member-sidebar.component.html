<!-- Mobile Toggle Menu Button -->
<div class="mobile-toggle-header">
  <button class="mobile-toggle-btn" (click)="toggleSidebar()">
    <span class="toggle-text">會員選單</span>
    <span class="toggle-icon">{{ isOpen ? '✕' : '☰' }}</span>
  </button>
</div>

<aside class="sidebar" [class.mobile-open]="isOpen">
  <div class="sidebar-header">
    <h2 class="sidebar-title">會員中心</h2>
    <button class="mobile-close-btn" (click)="toggleSidebar()">✕</button>
  </div>

  <nav class="sidebar-nav">
    <ul>
      <li><a routerLink="/member" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeSidebar()">我的主頁</a></li>
      <li><a routerLink="/reservation" routerLinkActive="active" (click)="closeSidebar()">線上預約</a></li>
      <li><a routerLink="/cart" routerLinkActive="active" (click)="closeSidebar()">我的購物車</a></li>
      <li><a routerLink="/order-history" routerLinkActive="active" (click)="closeSidebar()">歷史訂單</a></li>
      <li><button class="logout-btn" (click)="logout()">會員登出</button></li>
    </ul>
  </nav>
</aside>

<!-- 背景暗化 (手機版) -->
<div class="sidebar-backdrop" *ngIf="isOpen" (click)="toggleSidebar()"></div>
