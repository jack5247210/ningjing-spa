<div class="cart-sidebar" [class.collapsed]="!isVisible">
  <ng-container *ngIf="isVisible; else collapsedTab">
    <div class="cart-header">
      <h3 class="sidebar-title">購物車明細</h3>
      <button class="close-btn" (click)="close()">✕</button>
    </div>
    <div class="cart-items">
      <div *ngFor="let item of cartItems" class="cart-item">
        <img [src]="item.oilImg | imageUrl" class="item-img" />
        <div class="item-info">
          <div class="item-name">{{ item.name }}</div>
          <div class="item-price">NT$ {{ item.price }} x {{ item.quantity }}</div>
        </div>
        <div class="item-actions">
          <div class="qty-control">
            <button (click)="updateQuantity(item.oilId, item.quantity - 1)">-</button>
            <span>{{ item.quantity }}</span>
            <button (click)="updateQuantity(item.oilId, item.quantity + 1)">+</button>
          </div>
          <button class="text-remove" (click)="removeItem(item.oilId)">移除</button>
        </div>
      </div>
    </div>
    <div class="cart-footer">
      <div class="total">總計餘額：NT$ {{ totalAmount }}</div>
      <div *ngIf="giftMessage" class="gift-msg">禮物心意：{{ giftMessage }}</div>
      <button class="btn-primary checkout-btn" (click)="goToCartOrder()">確認結帳</button>
    </div>
  </ng-container>

  <ng-template #collapsedTab>
    <div class="collapsed-tab" (click)="open()">
      <span class="tab-badge" *ngIf="cartItems.length > 0">{{ cartItems.length }}</span>
      <span class="tab-text-vertical">購物明細</span>
    </div>
  </ng-template>
</div>
