<div class="product-container container">
  <h2 class="section-title">精選特調精油</h2>
  <p class="section-subtitle">淬鍊大自然的本質，純淨配方呵護您的每一天</p>

  <!-- 分类标签云 -->
  <div class="category-cloud" *ngIf="categories.length > 0">
    <button
      class="category-btn"
      [class.active]="selectedCategory === null"
      (click)="selectCategory(null)">
      全部精油
    </button>
    <button
      *ngFor="let cat of categories"
      class="category-btn"
      [class.active]="selectedCategory === cat"
      (click)="selectCategory(cat)">
      {{ cat }}
    </button>
  </div>

  <!-- 加载与错误状态 -->
  <div *ngIf="loading" class="loading-state">
    <div class="spinner"></div>
    <p>正在加載精油款式...</p>
  </div>
  <div *ngIf="error" class="error-msg">{{ error }}</div>

  <!-- 精油网格 -->
  <div class="product-grid" *ngIf="!loading && !error">
    <div *ngFor="let oil of oils" class="card product-card">
      <div class="card-image">
        <img [src]="oil.oilImg | imageUrl" [alt]="oil.name">
        <span class="tag tag-sage capacity-badge">{{ oil.capacity }}</span>
      </div>
      <div class="card-content">
        <h3 class="oil-name">{{ oil.name }}</h3>
        <p class="oil-intro">{{ oil.introduce }}</p>
        <div class="stock-info" [class.low-stock]="oil.stock < 5">
          <span class="stock-dot"></span> 僅剩 {{ oil.stock }} 件
        </div>
        <div class="card-footer">
          <span class="price">NT$ {{ oil.price }}</span>
          <button class="btn-ghost" [routerLink]="['/oil', oil.oilId]">查看詳情</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 侧边栏购物车 -->
<app-oil-cart-order *ngIf="isLoggedIn"></app-oil-cart-order>
