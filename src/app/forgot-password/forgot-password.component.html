<div class="login-container">
  <div class="login-card">
    <div class="login-form">
      <h2 class="form-title">忘記密碼</h2>
      <p class="form-subtitle">輸入您的註冊信箱，我們將寄送重設連結</p>

      <div class="input-group">
        <label for="email" class="input-label">電子郵件</label>
        <input type="email" id="email" [(ngModel)]="email" placeholder="your@email.com" class="form-input" />
      </div>

      <button class="btn-primary login-btn" (click)="submit()" [disabled]="loading">
        {{ loading ? '傳送中...' : '寄送重設連結' }}
      </button>

      <div *ngIf="message" class="alert" [class.alert-success]="success" [class.alert-error]="!success">
        {{ message }}
      </div>

      <div class="form-actions" style="justify-content: center;">
        <button class="text-link" routerLink="/login">返回登入</button>
      </div>
    </div>
  </div>
</div>
