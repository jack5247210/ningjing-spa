<div class="login-container">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-content">
        <h1 class="brand-title">寧境</h1>
        <p class="brand-subtitle">愛與療癒心空間</p>
        <div class="brand-divider"></div>
        <p class="brand-quote">加入我們，<br>開啟專屬的身心呵護之旅</p>
      </div>
    </div>

    <div class="login-form">
      <h2 class="form-title">建立帳號</h2>
      <p class="form-subtitle">開始您的芳香旅程</p>

      <div class="input-group">
        <label for="name" class="input-label">暱稱</label>
        <input type="text" id="name" [(ngModel)]="name" placeholder="您的稱呼" class="form-input" />
      </div>

      <div class="input-group">
        <label for="age" class="input-label">年齡</label>
        <input type="number" id="age" [(ngModel)]="age" placeholder="例如: 28" class="form-input" />
      </div>

      <div class="input-group">
        <label for="email" class="input-label">電子郵件</label>
        <input type="email" id="email" [(ngModel)]="email" placeholder="your@email.com" class="form-input" autocomplete="email" />
      </div>

      <div class="input-group">
        <label for="password" class="input-label">密碼</label>
        <input type="password" id="password" [(ngModel)]="password" placeholder="至少 6 個字元" class="form-input" autocomplete="new-password" />
      </div>

      <button class="btn-primary login-btn" (click)="register()">送出註冊</button>

      <div class="form-actions" style="justify-content: center;">
        <button class="text-link" (click)="goToLogin()">已經有帳號？前往登入</button>
      </div>

      <p class="login-footer">註冊即表示願意接收寧境的專屬通訊</p>
    </div>
  </div>
</div>
